<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>countenance</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; user-select: none; }   /* nothing for select-all to grab */
  canvas#screen {
    display: block;
    position: absolute;            /* sized and centred by Screen.resize() */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: none;
  }
  canvas#screen.smooth { image-rendering: auto; }
  /* the terminal redrawn through a warp, laid exactly over it while a holy word is on screen */
  canvas#gravity {
    position: absolute; display: none; pointer-events: none;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  canvas#gravity.smooth { image-rendering: auto; }
  /* the holy word itself, floating out of the glass: crisp, full resolution */
  canvas#levitate {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none;
  }
  /* light that is not part of the terminal: smooth, unbounded, over everything */
  canvas#radiance {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    pointer-events: none; mix-blend-mode: screen;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<canvas id="gravity"></canvas>
<canvas id="radiance"></canvas>
<canvas id="levitate"></canvas>
<script>
'use strict';

/* ============================================================
   countenance — stage 1 prototype
   A fake curses terminal: a cell grid drawn to an offscreen canvas
   at (window - 64px) and then stretched to the window with
   nearest-neighbour scaling so the pixels come out a little uneven.
   ============================================================ */

// ---------- configuration ----------
const CFG = {
  fontFamily: '"Cascadia Mono", "Liberation Mono", "DejaVu Sans Mono", monospace',
  fontPx: 20,              // native render size; bigger = sharper after scaling
  lineHeight: 1.25,
  cols: 104, rows: 30,      // fixed terminal size; scaled to fit the window
  colors: {
    bg:        '#000000',
    fg:        '#c8c8c8',   // ordinary text
    dim:       '#5a5a5a',   // typed / spent
    bright:    '#ffffff',
    primary:   '#ffd75f',   // the consonant you must type next
    secondary: '#e4e4e4',   // consonants still to come
    vowel:     '#8a8a8a',
    border:    '#8a8a8a',
    tabBg:     '#1c3f95',
    tabFg:     '#ffffff',
    tabActBg:  '#ffffff',
    tabActFg:  '#1c3f95',
    money:     '#ffd75f',
    ok:        '#5faf5f',
    bad:       '#d75f5f',
    contract:  '#5f87d7',   // a bought word in the ledger: no pay, just a dash
    ghost:     '#6a6a6a',
    statusBg:  '#303030',   // the status bar under the input   // the grey consonants waiting to be overwritten
  },
  cents: 10,
  bonusCents: 100,         // for matching an amulet's gematria
  violationHoldMs: 1500,   // the machine thinks about what you said before the notice appears
  holdMs: 1000,            // how long a finished word lingers before entering history
  errBlankMs: 1000,        // after a mistake, silence this long blanks the box
  hebCol: 10,              // width of the hebrew column on the left (letters hug its right edge)
  gap: 2,                  // whitespace between columns
  romCol: 19,              // fixed width of the romanization column in the history (longer is clipped)
  valCol: 4,               // width of the gematria column (right-aligned numbers)
  earnCol: 5,              // "$5.25"
  amuHebCol: 5,            // the matched amulet, hebrew (right-aligned)
  amuGlossCol: 10,         // the matched amulet, glossed
  amuletCaps: true,        // romanized amulets in caps like the words, or lowercase
  matchHoldMs: 5000,       // the think lasts this long on a match, with the amulet lit the whole time
  wakingMatchHoldMs: 250,  // ...but under the waking word matches come fast, so the lit pause is shorter
  inputMax: 40,            // how far a stray typist can run past the end of the word
  sideCols: 38,            // width of the AMULETS side panel
  activeRows: 6,           // height of the ACTIVE NAMES frame beneath it, borders included
  lowCharges: 5,           // at or below this many charges a name's row turns red
  expiredMs: 0,            // a spent name lingers this long, white on red, before it is struck off (0: no flash)
  amuletsShown: 5,
  juice: 0.08,             // chance that a word is rigged to match an amulet (?juice=0 to disable)
  boxCols: 20,
  statusMsg: 'Speak slowly and enunciate.',             // fixed interior width of the input box (longest word is 16 letters)
};

// ---------- the screen (cell grid) ----------
class Screen {
  constructor() {
    this.view = document.getElementById('screen');
    this.ctx = this.view.getContext('2d');
    const q = new URLSearchParams(location.search);
    this.smooth = q.has('smooth');
    if (q.get('font')) CFG.fontPx = parseInt(q.get('font'), 10);   // dev: ?font=28
    if (q.get('cols')) CFG.cols = parseInt(q.get('cols'), 10);     // dev: ?cols=80&rows=24
    if (q.get('rows')) CFG.rows = parseInt(q.get('rows'), 10);
    if (q.get('juice') != null) CFG.juice = parseFloat(q.get('juice'));
    this.resize();
  }
  resize() {
    const W = window.innerWidth, H = window.innerHeight;
    this.ctx.font = `${CFG.fontPx}px ${CFG.fontFamily}`;
    this.cw = Math.round(this.ctx.measureText('M').width);
    this.ch = Math.round(CFG.fontPx * CFG.lineHeight);
    this.cols = CFG.cols; this.rows = CFG.rows;
    // the canvas holds the grid at native resolution; CSS stretches it to fit
    // the window (letterboxed), and the compositor does the nearest-neighbour
    // upscale for free.  that uneven stretch is the aliasing we want.
    this.view.width = this.cols * this.cw;
    this.view.height = this.rows * this.ch;
    const sc = Math.min(W / this.view.width, H / this.view.height);
    const dw = Math.round(this.view.width * sc), dh = Math.round(this.view.height * sc);
    this.view.style.width = dw + 'px'; this.view.style.height = dh + 'px';
    this.view.style.left = Math.floor((W - dw) / 2) + 'px';
    this.view.style.top = Math.floor((H - dh) / 2) + 'px';
    this.cells = new Array(this.cols * this.rows);
    this.shown = new Array(this.cols * this.rows);   // what is currently painted
    this.clear();
    this.ctx.fillStyle = CFG.colors.bg; this.ctx.fillRect(0, 0, this.view.width, this.view.height);
    for (let i = 0; i < this.shown.length; i++) this.shown[i] = null;
  }
  clear() {
    for (let i = 0; i < this.cells.length; i++) this.cells[i] = null;
  }
  // put a single character at (col,row)
  put(col, row, ch, fg = CFG.colors.fg, bg = null, bold = false) {
    if (col < 0 || row < 0 || col >= this.cols || row >= this.rows) return;
    this.cells[row * this.cols + col] = { ch, fg, bg, bold };
  }
  text(col, row, str, fg, bg, bold) {
    str = str == null ? '' : String(str);
    for (let i = 0; i < str.length; i++) this.put(col + i, row, str[i], fg, bg, bold);
  }
  fill(col, row, w, h, ch, fg, bg) {
    for (let r = row; r < row + h; r++) for (let c = col; c < col + w; c++) this.put(c, r, ch, fg, bg);
  }
  box(col, row, w, h, title, fg = CFG.colors.border) {
    this.put(col, row, '┌', fg); this.put(col + w - 1, row, '┐', fg);
    this.put(col, row + h - 1, '└', fg); this.put(col + w - 1, row + h - 1, '┘', fg);
    for (let c = col + 1; c < col + w - 1; c++) { this.put(c, row, '─', fg); this.put(c, row + h - 1, '─', fg); }
    for (let r = row + 1; r < row + h - 1; r++) { this.put(col, r, '│', fg); this.put(col + w - 1, r, '│', fg); }
    if (title) {
      const t = `┤ ${title} ├`;
      this.text(col + 2, row, t, fg);
      this.text(col + 4, row, title, CFG.colors.bright, null, true);
    }
  }
  static same(a, b) {
    if (a === b) return true;
    if (!a || !b) return (!a || (a.ch === ' ' || !a.ch) && !a.bg) && (!b || (b.ch === ' ' || !b.ch) && !b.bg);
    return a.ch === b.ch && a.fg === b.fg && a.bg === b.bg && !!a.bold === !!b.bold;
  }
  render() {
    // repaint only the cells that differ from what is on screen, like a
    // terminal does.  the font is set only when it changes between cells.
    const o = this.ctx, n = this.cells.length;
    o.textBaseline = 'middle';
    o.textAlign = 'center';
    let font = null, fg = null;
    for (let i = 0; i < n; i++) {
      const cell = this.cells[i], prev = this.shown[i];
      if (Screen.same(cell, prev)) continue;
      const c = i % this.cols, r = (i / this.cols) | 0;
      const x = c * this.cw, y = r * this.ch;
      o.fillStyle = (cell && cell.bg) || CFG.colors.bg;
      o.fillRect(x, y, this.cw, this.ch);
      fg = null;                                   // fillStyle is now the background colour
      if (cell && cell.ch && cell.ch !== ' ') {
        const f = cell.bold ? 'bold' : 'normal';
        if (f !== font) { o.font = `${f} ${CFG.fontPx}px ${CFG.fontFamily}`; font = f; }
        if (cell.fg !== fg) { o.fillStyle = cell.fg; fg = cell.fg; }
        o.fillText(cell.ch, x + this.cw / 2, y + this.ch / 2 + 1);
      }
      this.shown[i] = cell;
    }
    this.view.classList.toggle('smooth', this.smooth);
    this.version = (this.version || 0) + 1;      // for anything that copies the screen (the gravity)
  }
}

// ---------- the holy word: shared ----------
// Three layers dress a holy word, each its own module: GRAVITY creases the
// screen around it (WebGL, under everything), RADIANCE glows about it, and
// LEVITATE draws the word itself floating out of the glass.  The terminal's own
// copy stays exactly where an ordinary word would be.  They share one clock and
// one hover, so the light and the creases rise and fall with the floating word.
// After each paint the ledger hands every layer the holy rows, in cells:
//   { col, row, w, h, seed, glyphs: [{col, row, ch}] }
CFG.levitate = {
  scale: 1.08,               // the floating word is this much larger than the text
  amp: 0.088,                // how far it bobs, in line heights
  period: 11,                // seconds for one slow rise and fall
  wavelength: 10,            // the rise and fall travels along the word like a flag; crest to crest, in line heights
  slice: 2,                  // width of the strips the word is cut into to ripple, in screen pixels
  glow: 0.55,                // blur of its glow, in line heights
  glowColor: 'rgba(255, 246, 226, 0.95)',
  color: '#ffffff',
  restColor: null,           // the terminal's own copy while the word floats: a colour, or null to hide it
};
const Holy = {
  t0: performance.now(),
  time: now => (now - Holy.t0) / 1000,
  // how far above its resting place the word floats now, in line heights (up is negative),
  // at u line heights from the left of the window: a wave travelling rightward along the word
  lift: (t, u = 0) => -CFG.levitate.amp * (0.5 - 0.5 * Math.cos(2 * Math.PI * (t / CFG.levitate.period - u / CFG.levitate.wavelength))),
  rng(seed) {
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  },
  // cells to the pixels of a canvas laid over the whole window at k canvas px per window px
  toWindow(cellRects, screen, k) {
    const b = screen.view.getBoundingClientRect();
    const sx = b.width / screen.view.width * k, sy = b.height / screen.view.height * k;
    const px = col => b.left * k + col * screen.cw * sx, py = row => b.top * k + row * screen.ch * sy;
    return cellRects.map(c => ({
      x: px(c.col), y: py(c.row), w: c.w * screen.cw * sx, h: c.h * screen.ch * sy, cell: screen.ch * sy,
      font: CFG.fontPx * sy, seed: c.seed || 1,
      glyphs: (c.glyphs || []).map(g => ({ x: px(g.col + 0.5), y: py(g.row + 0.5), ch: g.ch })),
    }));
  },
  // a source moved by the current hover, each letter by the wave where it stands
  lifted(src, t) {
    const dy = Holy.lift(t, (src.x + src.w / 2) / src.cell) * src.cell;
    return { ...src, y: src.y + dy, glyphs: src.glyphs.map(g => ({ ...g, y: g.y + Holy.lift(t, g.x / src.cell) * src.cell })) };
  },
};

// ---------- radiance ----------
// Light that does not belong to the terminal, on its own full-window canvas
// and its own clock, so it flows between paints and spills past the row and
// the screen.  It sleeps when nothing holy is visible.
//
// An effect is a function (ctx, src, t, P, rng) that draws one source:
//   src: { x, y, w, h, cell, glyphs }   the row's text, in canvas pixels, already
//        lifted by the hover; cell = one line's height; glyphs = [{x, y}] letter centres
//   t:   seconds on the shared clock
//   P:   CFG.radiance.<effect name>, for tuning
//   rng: a seeded random generator, the same every frame for the same source
// Choose with ?rays=<name> (or ?rays=off); tune in CFG.radiance.
CFG.radiance = {
  effect: 'aura',
  resolution: 0.5,           // canvas pixels per window pixel; light is soft, so half is plenty
  burst:  { rays: 44, reach: 12, width: 0.05, sway: 0.12, speed: 0.25, flicker: 1.3,
            alpha: 0.45, bloom: 0.55, color: [255, 244, 214] },
  shafts: { beams: 9, slant: 0.35, width: 2.4, drift: 0.08, alpha: 0.22, bloom: 0.45, color: [255, 246, 220] },
  // aura: every letter breathes a soft blob; larger wisps wander off the letters,
  // rise, and fade.  overlapping light adds up, so the blobs merge and part.
  aura:   { core: 1.4, coreAlpha: 0.18, wisps: 22, wispSize: [0.9, 2.6], wander: 0.9, rise: 1.0,
            life: [4, 9], wispAlpha: 0.09, color: [255, 246, 226], tint: [200, 215, 255], tintMix: 0.35 },
  halo:   { size: 3, breathe: 0.6, alpha: 0.6, color: [255, 248, 230] },
};
const Radiance = (() => {
  const cv = document.getElementById('radiance'), ctx = cv.getContext('2d');
  const q = new URLSearchParams(location.search).get('rays');
  let sources = [], raf = 0, painted = false;
  const effects = {};
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a))})`;

  function resize() {
    const k = CFG.radiance.resolution;
    cv.width = Math.ceil(window.innerWidth * k); cv.height = Math.ceil(window.innerHeight * k);
    painted = true;                                       // resizing clears it; make sure we repaint
    wake();
  }
  function set(cellRects, screen) {
    sources = q === 'off' ? [] : Holy.toWindow(cellRects, screen, CFG.radiance.resolution);
    wake();
  }
  function wake() { if (!raf && (sources.length || painted)) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, cv.width, cv.height);
    painted = false;
    if (!sources.length) return;                          // nothing holy on screen: sleep
    const name = q && effects[q] ? q : CFG.radiance.effect;
    const fx = effects[name], P = CFG.radiance[name] || {};
    const t = Holy.time(now);
    ctx.globalCompositeOperation = 'lighter';
    for (const src of sources) { ctx.save(); fx(ctx, Holy.lifted(src, t), t, P, Holy.rng(src.seed)); ctx.restore(); }
    painted = true;
    raf = requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  return { effects, set, resize, rgba };
})();

// ---------- levitate ----------
// The holy word itself, a little larger than the text and glowing, floating
// above its resting place and bobbing slowly.  ?hover=off hides it.
const Levitate = (() => {
  // the word is painted once, at rest, into a sprite; each frame the sprite is
  // resampled at a fractional offset, so the bob glides between pixels
  // instead of snapping to them (text and layer transforms both snap)
  const cv = document.getElementById('levitate'), ctx = cv.getContext('2d');
  const off = new URLSearchParams(location.search).get('hover') === 'off';
  let sources = [], raf = 0, k = 1, key = '', sprites = [], dirty = [];
  function resize() {
    k = window.devicePixelRatio || 1;
    cv.width = Math.ceil(window.innerWidth * k); cv.height = Math.ceil(window.innerHeight * k);
    key = ''; dirty = []; build(); wake();
  }
  function set(cellRects, screen) {
    sources = off ? [] : Holy.toWindow(cellRects, screen, k).filter(s => s.glyphs.length);
    build(); wake();
  }
  function build() {
    const nk = JSON.stringify([cv.width, sources.map(s => [s.font, s.glyphs])]);
    if (nk === key) return;
    key = nk;
    const L = CFG.levitate;
    sprites = sources.map(src => {
      // grow about the word's own centre
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const g of src.glyphs) { x0 = Math.min(x0, g.x); x1 = Math.max(x1, g.x); y0 = Math.min(y0, g.y); y1 = Math.max(y1, g.y); }
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      const pad = Math.ceil(src.cell * (1 + L.glow * 2));
      const ox = Math.floor(cx - (cx - x0) * L.scale - pad), oy = Math.floor(cy - (cy - y0) * L.scale - pad);
      const sp = document.createElement('canvas');
      sp.width = Math.ceil((x1 - x0) * L.scale + pad * 2 + 2); sp.height = Math.ceil((y1 - y0) * L.scale + pad * 2 + 2);
      const c = sp.getContext('2d');
      c.font = `bold ${src.font * L.scale}px ${CFG.fontFamily}`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = L.color;
      for (const pass of [L.glow * src.cell, 0]) {        // the glow, then the letters crisp on top
        c.shadowBlur = pass; c.shadowColor = pass ? L.glowColor : 'transparent';
        for (const g of src.glyphs)
          c.fillText(g.ch, cx + (g.x - cx) * L.scale - ox, cy + (g.y - cy) * L.scale + src.cell * 0.04 - oy);
      }
      return { sp, ox, oy, cell: src.cell };
    });
  }
  function wake() { if (!raf && (sprites.length || dirty.length)) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0;
    for (const d of dirty) ctx.clearRect(d[0], d[1], d[2], d[3]);
    dirty = [];
    if (!sprites.length) return;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    const t = Holy.time(now), amp = Math.ceil(CFG.levitate.amp * 1.01 * (sprites[0] ? sprites[0].cell : 0)) + 2;
    const sw = Math.max(1, Math.round(CFG.levitate.slice * k));
    for (const s of sprites) {
      // cut into thin strips, each lifted by the wave at its own place: fractional,
      // so resampled rather than snapped
      for (let x = 0; x < s.sp.width; x += sw) {
        const w = Math.min(sw, s.sp.width - x);
        const y = s.oy + Holy.lift(t, (s.ox + x + w / 2) / s.cell) * s.cell;
        ctx.drawImage(s.sp, x, 0, w, s.sp.height, s.ox + x, y, w, s.sp.height);
      }
      dirty.push([s.ox - 2, s.oy - amp, s.sp.width + 4, s.sp.height + amp + 2]);
    }
    raf = requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize();
  return { set, floating: !off };
})();

// a soft glow hugging the text; shared by the effects below
function radianceBloom(ctx, src, t, size, alpha, color) {
  const cx = src.x + src.w / 2, cy = src.y + src.h / 2;
  const rx = src.w / 2 + src.cell * size, ry = src.h / 2 + src.cell * size;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, Radiance.rgba(color, alpha));
  g.addColorStop(0.45, Radiance.rgba(color, alpha * 0.35));
  g.addColorStop(1, Radiance.rgba(color, 0));
  ctx.fillStyle = g;
  ctx.fillRect(-rx, -rx, rx * 2, rx * 2);
  ctx.restore();
}

// burst: thin rays streaming out from all along the word, swaying and flickering
Radiance.effects.burst = (ctx, src, t, P, rng) => {
  const cy = src.y + src.h / 2;
  for (let i = 0; i < P.rays; i++) {
    const ox = src.x + rng() * src.w, oy = cy + (rng() - 0.5) * src.h * 0.6;
    const base = rng() * Math.PI * 2, ph = rng() * 100, sp = 0.5 + rng();
    const ang = base + Math.sin(t * P.speed * sp + ph) * P.sway;
    const len = src.cell * P.reach * (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * P.flicker * sp * 0.7 + ph * 1.7)))
              * (0.5 + rng());
    const a = P.alpha * (0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * P.flicker * sp + ph), 2));
    const half = P.width * (0.5 + rng());               // angular half-width, radians
    const ex = ox + Math.cos(ang) * len, ey = oy + Math.sin(ang) * len;
    const g = ctx.createLinearGradient(ox, oy, ex, ey);
    g.addColorStop(0, Radiance.rgba(P.color, a));
    g.addColorStop(0.3, Radiance.rgba(P.color, a * 0.5));
    g.addColorStop(1, Radiance.rgba(P.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(ox, oy);
    ctx.lineTo(ox + Math.cos(ang - half) * len, oy + Math.sin(ang - half) * len);
    ctx.lineTo(ox + Math.cos(ang + half) * len, oy + Math.sin(ang + half) * len);
    ctx.closePath(); ctx.fill();
  }
  radianceBloom(ctx, src, t, 2 + 0.4 * Math.sin(t * 0.9), P.bloom * (0.85 + 0.15 * Math.sin(t * 1.3)), P.color);
};

// shafts: slanting beams falling from above the window onto the word
Radiance.effects.shafts = (ctx, src, t, P, rng) => {
  const top = -src.cell * 4, bottom = src.y + src.h + src.cell * 2;
  for (let i = 0; i < P.beams; i++) {
    const u = rng(), ph = rng() * 100, wv = P.width * src.cell * (0.4 + rng());
    const fx = src.x + (u + Math.sin(t * P.drift * (0.5 + rng()) + ph) * 0.15) * src.w;
    const sx = fx - (bottom - top) * P.slant;
    const a = P.alpha * (0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.7 + ph)));
    const g = ctx.createLinearGradient(0, top, 0, bottom);
    g.addColorStop(0, Radiance.rgba(P.color, 0));
    g.addColorStop(0.75, Radiance.rgba(P.color, a * 0.6));
    g.addColorStop(1, Radiance.rgba(P.color, a));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(sx - wv * 1.6, top); ctx.lineTo(sx + wv * 1.6, top);

// ---------- the cigarette ----------
// A cigarette burning down as a progress bar, drawn into the cell grid.  Filter
// on the left, paper to the right, the ember eating leftward with ash behind it
// that falls away in lumps, and smoke rising off the ember.
//
// Everything is a function of (s, t): s = seconds since it was lit (null: not lit yet), which sets
// how far it has burned and when the ash fell; t = seconds on the wall clock,
// for the ember's flicker and the smoke.  No state, so it can be scrubbed.
//
// This file is the drop-in: paste it into index.html beside the other modules
// and call Cigarette.draw(scr, ...) from drawClockOut().  It reads only
// CFG.cigarette and the scr passed in.
CFG.cigarette = {
  style: 'slim',             // slim (one row) | fat (two rows) | ascii (characters only)
  len: 32,                   // whole length in cells, filter included
  filter: 0.24,              // the filter's share of the length
  duration: 60,              // seconds from lit to the filter
  ash: [3, 8],               // cells of ash that build up before a lump falls
  fall: 0.9,                 // seconds a falling lump stays visible
  smoke: true,
  plumes: 7,                 // wisps of smoke in the air at once
  rise: 1.6,                 // rows per second the smoke climbs
  height: 7,                 // rows it climbs before it is gone
  wind: 0.6,                 // cells per row it leans rightward
  seed: 7,
  colors: {
    filter:  '#c8955a',
    speckle: '#9c6a35',
    band:    '#d7af5f',      // the gold ring where the filter meets the paper
    paper:   '#e8e4dc',
    scorch:  '#c9b08a',      // paper just ahead of the ember
    tobacco: ['#8a5a2b', '#5c3a1a'],   // the open end, before it is lit
    ember:   ['#ff5f00', '#ff8700', '#d73a00', '#ffaf00'],
    ash:     '#6c6c6c',
    ashDark: '#3a3a3a',      // the char right behind the ember

    if (s == null) return { nFilter, frac: 0, ember: P.len, ashEnd: P.len, drops: [], out: false, unlit: true };

      const ex = x + Math.floor(b.ember), top = y + rows[0] - 1;
      const life = P.height / P.rise;
      for (let i = 0; i < P.plumes; i++) {
        const age = (t + i * life / P.plumes) % life;
        const gen = Math.floor((t + i * life / P.plumes) / life);   // each wisp a new one each time round
        const h = age * P.rise, ph = hash(P.seed, i, gen) * 6.28;
        const dx = Math.round(Math.sin(ph + h * 0.9) * (0.4 + h * 0.25) + h * P.wind * (0.5 + hash(P.seed, gen, i)));
        const k = h / P.height;
        const ch = k < 0.15 ? '\'' : k < 0.45 ? (Math.sin(ph + h) > 0 ? ')' : '(') : k < 0.75 ? '~' : '.';
        const col = P.colors.smoke[Math.min(P.colors.smoke.length - 1, Math.floor(k * P.colors.smoke.length))];
        scr.put(ex + dx, top - Math.floor(h), ch, col);
      }
    }
    return b;
  }

  // seconds from lit until the last of the ash has fallen out of sight
  const spent = (P = CFG.cigarette) => P.duration + P.fall;

  return { draw, burn, spent, height: P => (P || CFG.cigarette).style === 'fat' ? 2 : 1 };
})();

// ---------- the break ----------
// The CLOCK OUT tab.  An ordinary tab with a menu, from which you choose to
// step outside: you are never taken out by wandering through the tabs.  Outside,
// a cigarette, not yet lit, over a few words about where you are and a choice:
// LIGHT UP or GO BACK IN.  Lit, the dialogue goes, and so does the tab bar; a
// covert line opens under the cigarette: no caret until you speak, and a word
// left alone for a moment is spoken into the air, rises a line, and fogs away
// in grey steps.  Nothing here is heard by the microphone.
//
// Drop-in with cigarette.js.  The caller owns the clock and the tabs:
//   Break.key(e, now)          -> 'light' | 'back' | true (handled) | false
//   Break.draw(scr, x, y, w, h, now, s)   s = seconds since lit (the caller's clock)
//   Break.captive()            true from stepping out until GO BACK IN: every key is the break's
//   Break.bare(now, s)         true while smoking: the tab bar is not drawn
//   Break.reset()              back to the menu
//   Break.endS()               s at which it ends: the last ash fallen, and a breath
//   Break.hear = word => ...   the host's ear for names: given the letters so far, return
//                              { text, fg, bold, holy, take() } if they end in a name, else null.
//                              It is asked after every letter, so it must not act: take() does
//                              whatever the word does, and is called once, as it is spoken.
//   Break.holyCells            after draw: the holy words in the air, for the light layers
CFG.breakScene = {
  scene: 'A chilly alley outside the Name Center, thankfully sheltered from the wind. ' +
         'Your breath fogs in the autumn air. No one\'s around to chat with.',
  menu: ['Step outside for a cigarette.'],
  options: ['LIGHT UP', 'GO BACK IN'],
  ending: 'The cigarette has burned down to the filter. You grind it out under your heel.',
  endOptions: ['GO BACK IN'],
  boxCols: 50,               // the dialogue's width, borders included
  smokeRows: 8,              // headroom kept above the cigarette for its smoke
  sendMs: 1000,              // silence this long and the word is spoken
  caretMs: 2000,             // ...and this much longer after, the caret goes away
  fieldCols: 24,             // the covert line's width; it starts under the cigarette's filter end
  fog: ['#9a9a9a', '#7a7a7a', '#5e5e5e', '#454545', '#303030', '#202020'],   // a spoken word's greys, in turn
  fogStepMs: 350,            // how long it holds each grey
  lingerMs: 1000,            // a name holds its colour this long before it fogs
  cooldownMs: 3000,          // after a name, you are hushed this long: no caret, and nothing more can be said
  holyMs: 3000,              // ...and a holy one floats in its light this long, then settles into the glass
  afterAshS: 1,              // once the last ash has fallen, this long before the ending dialogue
  // while you smoke, a few thoughts drift by in a box where the dialogue was, one at a time (only with ?thoughts, for now)
  thoughts: [
    'Nice to get away from the desk for a while.',
    'Can\'t wait to go home.',
  ],
  thoughtLeadS: 4,           // seconds after lighting before the first one begins to fade in
  thoughtSteps: 5,           // it fades in (and out) in this many discrete jumps of grey...
  thoughtStepS: 0.5,         // ...each held this many seconds
  thoughtHoldS: 4,           // seconds it lingers at full strength
  thoughtGapS: 20,           // seconds of nothing between one fading out and the next fading in
  thoughtCols: 50,           // the thought box's width, borders included
  speechStopsThoughts: true, // a letter said out here puts the thought away at once, and the rest never come
  escHint: '(Press ESC to go back inside early.)',
  escColor: '#4a4a4a',       // faint grey
};
if (!new URLSearchParams(location.search).has('thoughts')) CFG.breakScene.thoughts = [];   // a serene break by default; dev: ?thoughts for the interior monologue
const Break = (() => {
  let st;
  function reset() {
    st = { phase: 'menu', sel: 0, typed: '', lastKey: 0, spoken: [], hushUntil: 0, spoke: false };
  }
  reset();

  function speak(now, name = api.hear && st.typed && api.hear(st.typed)) {
    if (name) {
      name.take();
      st.spoken.push({ ...name, at: now, hold: name.holy ? CFG.breakScene.holyMs : CFG.breakScene.lingerMs });
    } else if (st.typed) st.spoken.push({ text: st.typed, at: now, hold: 0 });
    st.typed = '';
  }

  // at the filter the line closes, whatever is half-said goes out, and the ending comes up
  function burnOut(now, s) {
    if (st.phase === 'smoking' && s >= api.endS()) { speak(now); st.phase = 'out'; st.sel = 0; }
  }

  // a name keeps its own colour as it fogs, darkening in the same steps as the grey
  function fogged(wd, step) {
    const B = CFG.breakScene;
    return wd.fg ? dimmed(wd.fg, (B.fog.length - step) / B.fog.length) : B.fog[step];
  }

  // c's hex colour at strength k (0..1) over black
  function dimmed(c, k) {
    const n = parseInt(c.slice(1), 16);
    const ch = sh => Math.round((n >> sh & 255) * k).toString(16).padStart(2, '0');
    return `#${ch(16)}${ch(8)}${ch(0)}`;
  }

  // which thought is up s seconds after lighting, and how strongly: { text, k } or null
  function thought(s) {
    const B = CFG.breakScene, fade = B.thoughtSteps * B.thoughtStepS, span = 2 * fade + B.thoughtHoldS;
    const t = s - B.thoughtLeadS, i = Math.floor(t / (span + B.thoughtGapS)), u = t - i * (span + B.thoughtGapS);
    if (t < 0 || i >= B.thoughts.length || u >= span) return null;
    const step = Math.min(B.thoughtSteps, Math.floor(u / B.thoughtStepS) + 1, Math.floor((span - u) / B.thoughtStepS) + 1);
    return { text: B.thoughts[i], k: step / B.thoughtSteps };   // in jumps, never a smooth ramp
  }

  // the word goes out on its own once you have been quiet long enough
  function tick(now) {
    if (st.typed && now - st.lastKey >= CFG.breakScene.sendMs) speak(st.lastKey + CFG.breakScene.sendMs);
    const life = CFG.breakScene.fog.length * CFG.breakScene.fogStepMs;
    st.spoken = st.spoken.filter(w => now - w.at < life + w.hold);
  }

  function key(e, now) {
    const B = CFG.breakScene;
    // the menu: an ordinary tab, so ←→ are left to the tabs
    if (st.phase === 'menu') {
      if (e.key === 'ArrowDown') st.sel = Math.min(st.sel + 1, B.menu.length - 1);
      else if (e.key === 'ArrowUp') st.sel = Math.max(st.sel - 1, 0);
      else if (e.key === 'Enter') { st.phase = 'ask'; st.sel = 0; }
      else return false;
      return true;
    }
    // while a dialogue is up it has every key: they choose, nothing can be said
    if (st.phase === 'ask' || st.phase === 'out') {
      const opts = st.phase === 'ask' ? B.options : B.endOptions;
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(e.key)) {
        const back = e.key === 'ArrowLeft' || e.key === 'ArrowUp';
        st.sel = (st.sel + (back ? opts.length - 1 : 1)) % opts.length;
        return true;
      }
      if (e.key === 'Enter' || e.key === ' ') {
        if (opts[st.sel] === 'LIGHT UP') { st.phase = 'smoking'; return 'light'; }
        reset();
        return 'back';
      }
      if (e.key === 'Escape') { reset(); return 'back'; }    // ESC always leaves the break
      return true;
    }
    if (st.phase !== 'smoking') return false;
    if (e.key === 'Escape') { reset(); return 'back'; }      // the cigarette, abandoned
    if (now < st.hushUntil) return true;                     // still getting your breath back
    if (/^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
      st.lastKey = now;
      st.spoke = true;                                        // ...and the thoughts are gone for good
      // a name goes out the moment its last consonant is said, and hushes you
      // (any vowels trailing it, as in TO-HU-VA-VO-HU, fall in the hush)
      if (st.typed.length < B.fieldCols - 1) st.typed += e.key.toUpperCase();
      const name = api.hear && api.hear(st.typed);
      if (name) { speak(now, name); st.hushUntil = now + B.cooldownMs; st.lastKey = 0; }   // the prompt goes covert again
      return true;
    }
    if (e.key === 'Enter' || e.key === 'Backspace') { speak(now); st.lastKey = now - B.sendMs; return true; }   // as if the pause had come: no unsaying a sound
    return false;
  }

  // the scene, in the panel's interior
  function draw(scr, x0, y0, w, h, now, s) {
    const C = CFG.colors, B = CFG.breakScene, P = CFG.cigarette;
    api.holyCells = [];
    tick(now);
    burnOut(now, s);

    if (st.phase === 'menu') {                                // highlighted: reverse video, as on BUY NAMES
      B.menu.forEach((m, i) => {
        const hi = i === st.sel, r = y0 + 1 + i;
        if (hi) scr.fill(x0, r, w, 1, ' ', C.bg, C.fg);
        scr.text(x0 + 1, r, m, hi ? C.bg : C.fg, hi ? C.fg : null);
      });
      return;
    }

    const cx = x0 + Math.floor((w - P.len) / 2), cy = y0 + B.smokeRows;
    const below = cy + Cigarette.height(P);
    const thoughtH = 5, inputRow = below + 2 + thoughtH + 1, hintRow = y0 + h - 2;
    Cigarette.draw(scr, cx, cy, st.phase === 'ask' ? null : s, now / 1000, inputRow - 1);

    // the dialogue, if one is up: placed now, drawn last, over everything
    let dlg = null;
    if (st.phase === 'ask' || st.phase === 'out') {
      const text = st.phase === 'ask' ? B.scene : B.ending, opts = st.phase === 'ask' ? B.options : B.endOptions;
      const W = B.boxCols, inner = W - 4, lines = [];
      let line = '';
      for (const word of text.split(' ')) {
        if ((line + ' ' + word).trim().length > inner) { lines.push(line); line = word; }
        else line = (line + ' ' + word).trim();
      }
      lines.push(line);
      dlg = { lines, opts, W, H: lines.length + 6, x: x0 + Math.floor((w - W) / 2), y: below + 2 };
    }

    // the covert line, and the spoken words fogging above it, newest lowest
    const fx = cx;                                            // flush with the filter end
    const top = below + 4;                                    // clear of the falling ash
    st.spoken.slice().reverse().forEach((wd, i) => {
      const r = inputRow - 1 - i;
      if (r < top || dlg && r >= dlg.y && r < dlg.y + dlg.H) return;   // nothing shows through the dialogue
      const age = now - wd.at - wd.hold;
      if (age < 0 && !wd.holy) { scr.text(fx, r, wd.text, wd.fg, null, wd.bold); return; }   // a name, lingering
      if (age < 0) {                                          // still aloft: the light layers draw it
        api.holyCells.push({ col: fx, row: r, w: wd.text.length, h: 1, seed: (wd.at | 0) % 9973 + 1,
                             glyphs: [...wd.text].map((ch, j) => ({ col: fx + j, row: r, ch })) });
        const rest = Levitate.floating ? CFG.levitate.restColor : wd.fg;
        if (rest) scr.text(fx, r, wd.text, rest, null, wd.bold);
        return;
      }
      const step = Math.floor(age / B.fogStepMs);
      scr.text(fx, r, wd.text, fogged(wd, Math.min(step, B.fog.length - 1)), null, wd.bold);
    });
    scr.text(fx, inputRow, st.typed, C.fg);
    const since = now - st.lastKey;
    if (st.phase === 'smoking' && st.lastKey && since < B.sendMs + B.caretMs && since % 1000 < 500)
      scr.put(fx + st.typed.length, inputRow, ' ', C.bg, C.fg);   // the caret, blinking from the last key

    // while smoking: a thought box where the dialogue sits, the covert line under it, and the way back in at the bottom
    if (st.phase === 'smoking') {
      const th = !(B.speechStopsThoughts && st.spoke) && thought(s);
      if (th) {
        const W = B.thoughtCols, x = x0 + Math.floor((w - W) / 2), y = below + 2;
        scr.fill(x, y, W, thoughtH, ' ', C.fg, C.bg);
        scr.box(x, y, W, thoughtH, null, dimmed(C.border, th.k));
        scr.text(x + Math.floor((W - th.text.length) / 2), y + 2, th.text, dimmed(C.fg, th.k));
      }
      scr.text(x0 + Math.floor((w - B.escHint.length) / 2), hintRow, B.escHint, B.escColor);
    }

    if (dlg) {
      scr.fill(dlg.x, dlg.y, dlg.W, dlg.H, ' ', C.fg, C.bg);
      scr.box(dlg.x, dlg.y, dlg.W, dlg.H);
      dlg.lines.forEach((ln, i) => scr.text(dlg.x + 2, dlg.y + 2 + i, ln, C.fg));
      const btns = dlg.opts.map(o => `[ ${o} ]`), gap = 4;
      let bx = dlg.x + Math.floor((dlg.W - btns.join(' '.repeat(gap)).length) / 2);
      btns.forEach((b, i) => {
        const on = i === st.sel;
        scr.text(bx, dlg.y + dlg.H - 3, b, on ? C.bg : C.fg, on ? C.fg : null, on);
        bx += b.length + gap;
      });
    }
  }

  const api = { key, draw, reset, hear: null, holyCells: [], phase: () => st.phase,
                endS: () => Cigarette.spent() + CFG.breakScene.afterAshS,
                captive: () => st.phase !== 'menu', bare: (now, s) => { burnOut(now, s); return st.phase === 'smoking'; } };
  return api;
})();

// ---------- the office clock ----------
// A red seven-segment wall clock in the bottom right corner, at the end of the
// tab bar, once you have bought one.  It keeps the Company's time, not the
// wall's: the day starts at 8:00 AM and runs fast enough that one cigarette
// break, lighting to the last ash, is ten minutes.  It stops while the page is
// put away and picks up where it left off (state.clockT, saved with the game).
//   Clock.tick(now)           advance it to now (performance clock); calls Clock.onBell at each break time (every half hour)
//   Clock.place(scr, col, row) reserve its cells (blank, black) before scr.render()
//   Clock.paint(scr)          draw the digits over those cells, after scr.render(); not placed this frame, not drawn
CFG.clock = {
  dayStart: 8 * 3600,        // seconds after midnight that the day begins
  breakMinutes: 10,          // a whole cigarette break comes to this on the clock
  breakEvery: 30,            // minutes: a break comes due at each multiple of this past midnight (:00 and :30)
  wordsPerBreak: 20,         // the words to say from the prompt, once it is due, before you have earned it
  cols: 7, rows: 1,          // the cells it takes, in the corner (it is painted, so any size will do)
  saveEvery: 10,             // seconds (real) between saves while it runs
  on:  '#a8382e',            // a lit segment: a muted red
  off: '#170605',            // an unlit one, faintly there as on a real display
  bg:  '#000000',
};
const Clock = (() => {
  const K = CFG.clock;
  let at = null, last = null, sinceSave = 0;
  // clock seconds per real second
  const rate = () => K.breakMinutes * 60 / Break.endS();

  function tick(now) {
    const dt = last == null ? 0 : Math.min(1, (now - last) / 1000);   // a long gap (the page put away) is not made up
    last = now;
    if (!state.clock || document.hidden || !dt || state.menu) return;   // the game's menu stops it
    const bell = 60 * K.breakEvery, was = Math.floor(state.clockT / bell);
    state.clockT = (state.clockT + dt * rate()) % 86400;
    if (Math.floor(state.clockT / bell) !== was) api.onBell();
    if ((sinceSave += dt) >= K.saveEvery) { sinceSave = 0; save(); }
  }

  function place(scr, col, row) {
    at = { col, row };
    scr.fill(col, row, K.cols, K.rows, ' ', K.bg, K.bg);
  }

  // which of a b c d e f g are lit, per digit
  const SEGS = ['abcdef', 'bc', 'abdeg', 'abcdg', 'bcfg', 'acdfg', 'acdefg', 'abc', 'abcdefg', 'abcdfg'];

  function digit(o, x, y, w, h, th, lit) {
    const gap = th * 0.18, half = th / 2;
    // a segment from (x1,y1) to (x2,y2), pointed at both ends
    const seg = (x1, y1, x2, y2) => {
      const horiz = y1 === y2;
      o.beginPath();
      if (horiz) {
        x1 += gap; x2 -= gap;
        o.moveTo(x1, y1); o.lineTo(x1 + half, y1 - half); o.lineTo(x2 - half, y1 - half);
        o.lineTo(x2, y1); o.lineTo(x2 - half, y1 + half); o.lineTo(x1 + half, y1 + half);
      } else {
        y1 += gap; y2 -= gap;
        o.moveTo(x1, y1); o.lineTo(x1 + half, y1 + half); o.lineTo(x1 + half, y2 - half);
        o.lineTo(x1, y2); o.lineTo(x1 - half, y2 - half); o.lineTo(x1 - half, y1 + half);
      }
      o.closePath(); o.fill();
    };
    const L = x + half, R = x + w - half, T = y + half, M = y + h / 2, B = y + h - half;
    const at = { a: [L, T, R, T], b: [R, T, R, M], c: [R, M, R, B], d: [L, B, R, B],
                 e: [L, M, L, B], f: [L, T, L, M], g: [L, M, R, M] };
    for (const s of 'abcdefg') {
      o.fillStyle = lit && lit.includes(s) ? K.on : K.off;
      seg(...at[s]);
    }
  }

  function paint(scr) {
    if (!at) return;
    const o = scr.ctx, cw = scr.cw, ch = scr.ch;
    const X = at.col * cw, Y = at.row * ch, W = K.cols * cw, H = K.rows * ch;
    o.save();
    o.beginPath(); o.rect(X, Y, W, H); o.clip();
    o.fillStyle = K.bg; o.fillRect(X, Y, W, H);

    const mins = Math.floor(state.clockT / 60), h24 = Math.floor(mins / 60), m = mins % 60;
    const h12 = (h24 + 11) % 12 + 1, pm = h24 >= 12;
    const dh = H * 0.72, dw = dh * 0.5, th = Math.max(2, dh * 0.13), sp = th * 1.4, colon = th * 2.4;
    const amW = H * 0.42;                                      // room for AM/PM
    const total = 4 * dw + 3 * sp + colon + sp + amW;
    let x = X + (W - total) / 2;
    const y = Y + (H - dh) / 2;
    const digits = [h12 >= 10 ? SEGS[1] : null, SEGS[h12 % 10], SEGS[Math.floor(m / 10)], SEGS[m % 10]];
    digits.forEach((lit, i) => {
      digit(o, x, y, dw, dh, th, lit);
      x += dw + sp;
      if (i === 1) {                                           // the colon, steady
        o.fillStyle = K.on;
        const cx = x - sp / 2 + colon / 2 - th / 2;
        o.fillRect(cx, y + dh * 0.3 - th / 2, th, th);
        o.fillRect(cx, y + dh * 0.7 - th / 2, th, th);
        x += colon;
      }
    });
    o.font = `bold ${Math.max(7, Math.round(H * 0.3))}px ${CFG.fontFamily}`;
    o.textAlign = 'left'; o.textBaseline = 'alphabetic';
    o.fillStyle = pm ? K.off : K.on; o.fillText('AM', x, y + dh * 0.42);
    o.fillStyle = pm ? K.on : K.off; o.fillText('PM', x, y + dh);
    o.restore();
    at = null;                                                 // placed afresh each frame, or it is put away
  }

  const api = { tick, place, paint, onBell: () => {} };
  return api;
})();

// ---------- placeholder word generator ----------
// Stage 1 only: enough phonology to make the interface feel real.
// We will replace this with the real conlang protocol together.
const LETTERS = [
  // heb, final form, hard rom, soft rom (begadkefat), weight
  { h: 'ב', f: 'ב', hard: 'b',  soft: 'v',  w: 3  },
  { h: 'ג', f: 'ג', hard: 'g',  soft: 'g',  w: 2  },
  { h: 'ד', f: 'ד', hard: 'd',  soft: 'd',  w: 3  },
  { h: 'ה', f: 'ה', hard: 'h',  soft: 'h',  w: 2  },
  { h: 'ו', f: 'ו', hard: 'v',  soft: 'v',  w: 2  },
  { h: 'ז', f: 'ז', hard: 'z',  soft: 'z',  w: 2  },
  { h: 'ח', f: 'ח', hard: 'ch', soft: 'ch', w: 2  },
  { h: 'ט', f: 'ט', hard: 't',  soft: 't',  w: 2  },
  { h: 'י', f: 'י', hard: 'y',  soft: 'y',  w: 2  },
  { h: 'כ', f: 'ך', hard: 'k',  soft: 'kh', w: 3  },
  { h: 'ל', f: 'ל', hard: 'l',  soft: 'l',  w: 4  },
  { h: 'מ', f: 'ם', hard: 'm',  soft: 'm',  w: 4  },
  { h: 'נ', f: 'ן', hard: 'n',  soft: 'n',  w: 4  },
  { h: 'ס', f: 'ס', hard: 's',  soft: 's',  w: 2  },
  { h: 'פ', f: 'ף', hard: 'p',  soft: 'f',  w: 2  },
  { h: 'צ', f: 'ץ', hard: 'ts', soft: 'ts', w: 2  },
  { h: 'ק', f: 'ק', hard: 'k',  soft: 'k',  w: 2  },
  { h: 'ר', f: 'ר', hard: 'r',  soft: 'r',  w: 4  },
  { h: 'ש', f: 'ש', hard: 'sh', soft: 'sh', w: 3  },
  { h: 'ת', f: 'ת', hard: 't',  soft: 't',  w: 3  },
];
const VOWELS = ['a', 'a', 'a', 'e', 'e', 'i', 'o', 'u'];
const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];
function pickLetter() {
  const total = LETTERS.reduce((s, l) => s + l.w, 0);
  let r = Math.random() * total;
  for (const l of LETTERS) { r -= l.w; if (r < 0) return l; }
  return LETTERS[0];
}

// A word is a list of segments: {t:'C', heb, rom} or {t:'V', rom}.
// Syllable boundaries are marked with {t:'-'}.
function makeWord() {
  const nSyl = 2 + rnd(3);                 // 2..4 syllables
  const segs = [];
  let afterVowel = false;                  // for spirantization
  for (let s = 0; s < nSyl; s++) {
    if (s > 0) segs.push({ t: '-' });
    {
      const L = pickLetter();
      segs.push({ t: 'C', heb: L.h, rom: afterVowel ? L.soft : L.hard, L });
    }
    segs.push({ t: 'V', rom: pick(VOWELS) });
    afterVowel = true;
    if (Math.random() < 0.55) {            // coda
      const L = pickLetter();
      segs.push({ t: 'C', heb: L.h, rom: L.soft, L });
      afterVowel = false;
    }
  }
  // final letter form

const GEMATRIA = { 'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ך':20,'ל':30,
  'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400 };

// what a typed latin letter would have been in hebrew, for scoring mistakes.
// digraphs first so that SH is one letter, not S and H.
const ROM_TO_HEB = { sh: 'ש', ts: 'צ', ch: 'ח', kh: 'כ', b: 'ב', g: 'ג', d: 'ד', h: 'ה', v: 'ו', w: 'ו',
  z: 'ז', t: 'ת', y: 'י', j: 'י', k: 'כ', c: 'כ', q: 'ק', l: 'ל', m: 'מ', n: 'נ', s: 'ס', p: 'פ', f: 'פ', r: 'ר', x: 'ס' };
function romToHeb(str) {
  let out = '';
  for (let i = 0; i < str.length; i++) {
    const two = str.slice(i, i + 2);
    if (ROM_TO_HEB[two]) { out += ROM_TO_HEB[two]; i++; }
    else if (ROM_TO_HEB[str[i]]) out += ROM_TO_HEB[str[i]];
  }
  return out;
}

function replenishAmulets() {
  // draw fresh amulets (new spellings, new values) up to the target, in
  // ascending gematria order.  if there are more than the target, none are
  // taken away: they simply are not replaced as they are claimed.
  const have = new Set(state.amulets.map(a => a.heb));
  const vals = new Set(state.amulets.map(a => a.val));
  const pool = AMULET_POOL.filter(a => !have.has(a.heb) && !vals.has(a.val));
  while (state.amulets.length < amuletTarget() && pool.length) {
    const a = pool.splice(rnd(pool.length), 1)[0];
    state.amulets.push(a); vals.add(a.val);
    for (let i = pool.length - 1; i >= 0; i--) if (pool[i].val === a.val) pool.splice(i, 1);
  }

}

// build a word from a romanization and its hebrew, e.g. an upgrade's own word
function wordFrom(rom, heb) {
  const letters = [...heb];
  const segs = [];
  rom.split('-').forEach((syl, si) => {
    if (si > 0) segs.push({ t: '-' });
    for (let i = 0; i < syl.length; i++) {
      if ('aeiou'.includes(syl[i])) { segs.push({ t: 'V', rom: syl[i] }); continue; }
      const two = syl.slice(i, i + 2);
      const c = ['sh', 'ts', 'ch', 'kh'].includes(two) ? two : syl[i];
      segs.push({ t: 'C', heb: letters.shift(), rom: c });
      i += c.length - 1;
    }
  });
  return segs;
}

function setWord(word) {
  state.word = word;
  state.cons = [];
  state.word.forEach((s, i) => { if (s.t === 'C' && !s.silent) state.cons.push({ rom: s.rom, segIndex: i }); });
  state.ci = 0; state.li = 0;
}

function contractWord(id) {
  const u = UPGRADES.find(x => x.id === id);
  const w = wordFrom(u.rom, u.heb); w.free = true; w.grants = u.id;
  return w;
}
// an ordinary word must never contain a protected or secret name: saying the
// word you were given cannot be an infraction, or a windfall
const SPOKEN_KEYS = [...PROTECTED, ...SECRET_NAMES].map(u => consonantKey(u.rom));
const consonantsOf = w => w.filter(s => s.t === 'C' && !s.silent).map(s => s.rom).join('');
const innocent = w => !SPOKEN_KEYS.some(k => consonantsOf(w).includes(k));
function makeInnocentWord() {
  for (let i = 0; i < 1000; i++) { const w = makeWord(); if (innocent(w)) return w; }
  return makeWord();
}
function newWord() {
  // a bought word waits at the microphone until it has been said
  if (state.stack.length) { setWord(contractWord(state.stack.at(-1))); return; }   // the newest first
  state.word = makeInnocentWord();
  if (wakingActive() || Math.random() < CFG.juice) {
    // rigged: keep rolling until a word lands on one of the amulets on offer,
    // but never by simply being that amulet letter for letter
    const targets = new Set(state.amulets.map(a => a.val));
    for (let i = 0; i < 5000; i++) {
      const w = makeInnocentWord();
      if (targets.has(gematria(w)) && !AMULET_SPELLINGS.has(hebrew(w))) { state.word = w; break; }
    }
  }
  setWord(state.word);
}

function romanization(word) {
  return word.map(s => s.t === '-' ? '-' : s.rom).join('').toUpperCase();
}
function gematria(word) {

function hebrew(word) {
  return word.filter(s => s.t === 'C').map(s => s.heb).join('');
}
// draw a hebrew string right-aligned so that its right edge sits at column `right`
function putHebrew(right, row, str, fg, bgOrBold, bold) {
  // putHebrew(right, row, str, fg, bold) or putHebrew(right, row, str, fg, bg, bold)
  const bg = typeof bgOrBold === 'string' ? bgOrBold : null;
  if (typeof bgOrBold === 'boolean') bold = bgOrBold;
  [...str].forEach((ch, i) => scr.put(right - i, row, ch, fg, bg, bold));
}

function speakSuccess() {
  // the machine "thinks" about the word.  a match is known at once: the amulet
  // lights up for the whole (longer) think, then the ledger and the money land.
  const val = gematria(state.word);
  const a = state.word.free ? null : state.amulets.find(x => x.val === val && !x.won);   // a contract earns nothing
  if (a) a.won = true;
  state.matchHold = !!a;                   // the input row lights up alongside the amulet
  state.holding = true; state.holdTicks = 0;
  setTimeout(() => {
    if (state.modal) return;               // seized mid-think: the word is forfeit
    let earned = state.word.free ? 0 : CFG.cents + (a ? CFG.bonusCents : 0);
    if ((state.charges.honeyed || 0) > 0) earned *= 2;        // the honeyed word: everything pays double
    earn(earned);
    if (state.word.free) {
      const u = UPGRADES.find(x => x.id === state.word.grants);
      const label = (u ? u.title : 'contract').replace(/\s*©.*$/, '').toUpperCase();   // "WAKING WORD"
      logLine(`  ${romanization(state.word)}`, CFG.colors.contract, false, hebrew(state.word), val, null, null, label);
    }
    else logLine(`  ${romanization(state.word)}`, CFG.colors.fg, false, hebrew(state.word), val, earned,
                 a ? { heb: a.heb, gloss: a.gloss } : null);
    if (a) {                               // the claimed amulet is replaced
      state.amulets = state.amulets.filter(x => x !== a);
      delete a.won;
      replenishAmulets();
    }
    if (state.word.grants) redeem(state.word.grants);   // the bought word, now spoken
    if (!state.word.free && state.clock && state.breakDue && state.wordsLeft > 0 && --state.wordsLeft === 0) nudge('CLOCK OUT');   // one more done before the break; the last one earns it
    if (!state.word.free) for (const id of Object.keys(state.charges)) {
      if (--state.charges[id] <= 0) {
        delete state.charges[id];
        if (CFG.expiredMs > 0) {                           // shown spent for a moment, so you notice
          state.expired[id] = Date.now() + CFG.expiredMs;
          setTimeout(draw, CFG.expiredMs + 20);

}

  const i = state.stack.lastIndexOf(id);

// ---------- the law ----------
function detectViolation() {
  // speaking a proprietary word you have not paid for, in any context.
  // a word you have paid for but not yet said is licensed whenever it comes out:
  // saying it out of purchase order is no business of the law's, and it counts.
  const said = state.typed.join('');
  for (const sn of SECRET_NAMES) {
    if (!said.endsWith(consonantKey(sn.rom))) continue;
    const ln = sn.holy ? logLine(`  ${sn.rom.toUpperCase()}`, CFG.colors.bright, true, sn.heb, gval(sn.heb))
                       : logLine(`  ${sn.rom.toUpperCase()}`, CFG.colors.contract, false, sn.heb, gval(sn.heb), null, null,
                                 sn.title ? sn.title.toUpperCase() : false);      // named like a bought word, if it has a name
    if (sn.holy) ln.holy = true; else ln.unlisted = true;   // light, or just the blue and a dash
    sn.effect();
    clearBox();
    save();
    return true;
  }
  for (const u of PROTECTED) {
    const key = consonantKey(u.rom);
    if (!said.endsWith(key)) continue;
    if (!state.stack.includes(u.id)) { violate(u); return true; }
    if (state.holding && state.word.grants === u.id) return false;   // said at the microphone, in order: speakSuccess has it
    const label = u.title.replace(/\s*©.*$/, '').toUpperCase();
    logLine(`  ${u.rom.toUpperCase()}`, CFG.colors.contract, false, u.heb, gval(u.heb), null, null, label);
    redeem(u.id);
    // the attempt is over.  if the contract at the microphone was the one just
    // spent, the next licence (or an ordinary word) takes its place.
    clearBox();
    if (state.word.free && state.word.grants !== state.stack.at(-1)) newWord();
    save();
    return true;
  }
  return false;
}
function violate(u) {
  clearTimeout(state.errTimer);
  // the red line stays, the dots creep out as if the machine were weighing the
  // word, and only then does the notice come down, with the fine.  keys are
  // dead throughout.
  state.holding = true; state.holdTicks = 0;
  state.modal = { kind: 'violation', id: u.id, showAt: Date.now() + CFG.violationHoldMs, applied: false };
  save();
}
const modalVisible = () => state.modal && Date.now() >= (state.modal.showAt || 0);
function applyViolation(m) {
  // the fine and the record land the moment the notice appears, once
  const u = protectedById(m.id);
  earn(-u.penalty);
  state.infractions++;
  logLine(`  ${u.rom.toUpperCase()}`, CFG.colors.bad, true, u.heb, gval(u.heb), -u.penalty);
  // the word was still said, and words work: its power arrives along with the fine
  if (u.charges) state.charges[u.id] = (state.charges[u.id] || 0) + u.charges;
  replenishAmulets();
  m.applied = true;
  save();
}

function handleKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // the browser's own shortcuts (refresh, tabs, back, zoom) pass straight through
  if (state.modal) {
    e.preventDefault();
    // "any key": something you would actually press, not arrows, modifiers or function keys
    const real = e.key.length === 1 || ['Enter', 'Backspace', 'Escape'].includes(e.key);
    if (modalVisible() && real && !e.ctrlKey && !e.metaKey && !e.altKey) acceptModal();
    return;
  }
  if (state.menu) { e.preventDefault(); menuKey(e); return; }
  if (e.key === 'F9') { scr.smooth = !scr.smooth; e.preventDefault(); return; }
  if (state.tab === 'CLOCK OUT' && breaksOpen() && Break.captive()) { clockOutKey(e); return; }   // outside: no tabs, only back in (ESC too)
  if (e.key === 'Escape') { e.preventDefault(); state.menu = { sel: 0, confirm: null }; save(); return; }
  if (e.key === 'Tab' || e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    const i = state.tabs.indexOf(state.tab), n = state.tabs.length;
    state.tab = state.tabs[(i + (e.key === 'ArrowLeft' ? n - 1 : 1)) % n];
    return;
  }
  if (state.tab === 'BUY NAMES') {
    const can = buyable(), at = can.indexOf(selected());
    if (e.key === 'ArrowDown' && at >= 0) state.sel = can[Math.min(at + 1, can.length - 1)];
    else if (e.key === 'ArrowUp' && at >= 0) state.sel = can[Math.max(at - 1, 0)];
    else if (e.key === 'Enter') {
      const u = UPGRADES[selected()];
      if (u && state.cents >= u.cost) {
        earn(-u.cost);
        state.stack.push(u.id);
        // you are sent back to speak the word you just bought: the newest
        // purchase is said first.  nothing is granted until a word is said,
        // and saying it costs no charge.
        clearBox(); newWord();
        state.tab = 'SPEAK';
        save();
      }
    }
    return;
  }
  if (state.tab === 'OFFICE') {
    const can = officeBuyable(), at = can.indexOf(officeSelected());
    if (e.key === 'ArrowDown' && at >= 0) state.officeSel = can[Math.min(at + 1, can.length - 1)];
    else if (e.key === 'ArrowUp' && at >= 0) state.officeSel = can[Math.max(at - 1, 0)];
    else if (e.key === 'Enter' && at >= 0) {
      const it = OFFICE_ITEMS[officeSelected()];
      earn(-it.cost);
      it.buy();
      save();
    }
    return;
  }
  if (state.tab === 'CLOCK OUT' && breaksOpen()) { clockOutKey(e); return; }
  if (state.tab !== 'SPEAK') return;
  if (['Backspace', 'Delete'].includes(e.key)) {
    e.preventDefault();
    if (!state.holding) clearBox();         // any of these wipes the box and you start over
    return;
  }
  if (e.key.length !== 1 || e.ctrlKey || e.metaKey || e.altKey) return;
  let k = e.key.toLowerCase();
  if (state.holding) return;
  // the honeyed word: whatever you press, the right consonant comes out
  if ((state.charges.honeyed || 0) > 0 && !state.err && state.cons[state.ci]) k = state.cons[state.ci].rom[state.li];
  if (!/^[a-z]$/.test(k)) return;
  if ('aeiou'.includes(k)) return;          // vowels are not spoken here; typing them is harmless
  state.typed.push(k);
  const cur = state.cons[state.ci];
  if (!cur) return;
  if (state.err) speakFail(k);
  else if (cur.rom[state.li] === k) {
    state.li++;
    if (state.li >= cur.rom.length) { state.ci++; state.li = 0; }
    if (state.ci >= state.cons.length) speakSuccess();
  } else {
    speakFail(k);
  }
  detectViolation();                        // after the letter has landed, so it stays on screen
}

const devBreaks = new URLSearchParams(location.search).has('breaks');   // dev: the break before it is earned (not saved)
// out the door once the clock is up and the hour's words are said; and, once out, until you are back in
const breaksOpen = () => devBreaks || Break.captive() || state.clock && state.breakDue && state.wordsLeft <= 0;
function clockOutKey(e) {
  const smoked = ['smoking', 'out'].includes(Break.phase());
  const r = Break.key(e, performance.now());
  if (r) e.preventDefault();
  if (r === 'light') {
    state.litAt = performance.now();
    if (state.clock) { state.breakDue = false; save(); }   // the break is taken: wait for the next break time
  }
  if (r === 'back') {
    state.tab = 'SPEAK';
    if (smoked) clearBox();                  // back from a break, you have lost your place in the word
  }
}

// ---------- drawing ----------
// a ledger row may take several lines.  the hebrew breaks between words (or,
// failing that, wherever the column ends) and each line hugs the right edge;
// the romanization breaks after a hyphen and each line hugs the left edge.
function wrapHeb(str, width) {
  const lines = [];
  let cur = '';
  for (let word of str.split(' ').filter(Boolean)) {
    while ([...word].length > width) {                 // a word too long for the column is cut
      if (cur) { lines.push(cur); cur = ''; }
      lines.push([...word].slice(0, width).join(''));
      word = [...word].slice(width).join('');
    }
    if (!cur) cur = word;
    else if ([...cur].length + 1 + [...word].length <= width) cur += ' ' + word;
    else { lines.push(cur); cur = word; }
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}
function wrapRom(text, width) {
  const syls = text.split('-'), lines = [];
  let cur = '';
  syls.forEach((syl, i) => {
    const piece = syl + (i < syls.length - 1 ? '-' : '');
    if (cur && cur.length + piece.length > width) { lines.push(cur); cur = ''; }
    cur += piece;
  });
  if (cur) lines.push(cur);
  return lines.map(l => l.slice(0, width));
}
function ledgerLines(ln) {
  if (!ln.heb) return { heb: [], rom: [], n: 1 };
  const heb = wrapHeb(ln.heb, CFG.hebCol), rom = wrapRom(ln.text.trim(), CFG.romCol);
  return { heb, rom, n: Math.max(heb.length, rom.length) };
}

function drawSpeak(x0, y0, w, h) {
  const C = CFG.colors;
  // (column widths above are chosen so the six history columns fit the panel)
  // the prompt block takes the bottom 5 rows of the panel interior
  const promptRows = 5;      // divider, prompt row, input row, blank, status line
  const logRows = h - promptRows;
  // not quite a terminal: the welcome stays pinned at the top, the prompt is
  // pinned at the bottom, and history grows upward from the prompt.  once it
  // reaches the welcome, the oldest lines fall off the top.
  // the welcome sits at the top until history climbs up to meet it; from then
  // on everything scrolls together and the welcome drifts off the top.
  // history is anchored to the row above the prompt and grows upward; the
  // welcome is pinned to the top until the history reaches it, after which
  // the welcome is pushed up (and off) one row per new word.
  const wraps = state.log.map(ledgerLines);
  const histTop = y0 + logRows - wraps.reduce((a, x) => a + x.n, 0);
  const introTop = Math.min(y0, histTop - 1 - state.intro.length);
  state.intro.forEach((t, i) => { const rr = introTop + i; if (rr >= y0) scr.text(x0, rr, t.slice(0, w), CFG.colors.fg); });
  let r = histTop;
  state.log.forEach((ln, li) => {
    const wr = wraps[li];
    if (r + wr.n - 1 < y0) { r += wr.n; return; }        // wholly above the panel
    const top = Math.max(r, y0), c0 = x0 + CFG.valCol + CFG.gap, cr = c0 + CFG.hebCol + CFG.gap;
    const hw = CFG.hebCol + CFG.gap + CFG.romCol, hh = r + wr.n - top;
    const floats = ln.holy && !seized();                 // behind a notice it settles into the glass
    if (floats) {                                        // the light falls on the hebrew and its reading
      const glyphs = [];
      wr.heb.forEach((t, i) => [...t].forEach((ch, j) => { if (ch !== ' ') glyphs.push({ col: c0 + CFG.hebCol - 1 - j, row: r + i, ch }); }));
      wr.rom.forEach((t, i) => [...t].forEach((ch, j) => { if (ch !== ' ') glyphs.push({ col: cr + j, row: r + i, ch }); }));
      holyCells.push({ col: c0, row: top, w: hw, h: hh, seed: li + 1,
                       glyphs: glyphs.filter(g => g.row >= y0) });
    }
    if (ln.heb) {
      // columns: gematria | hebrew | romanization | earned | amulet hebrew | amulet gloss
      // (same order as the amulet panel: number, hebrew, then the rest)
      let cx = x0;
      if (ln.val != null && r >= y0) { const v = String(ln.val); scr.text(cx + CFG.valCol - v.length, r, v, ln.fg); }
      cx += CFG.valCol + CFG.gap;
      const tf = floats && Levitate.floating ? CFG.levitate.restColor : ln.fg;   // a floating word leaves its place
      if (tf) wr.heb.forEach((t, i) => { if (r + i >= y0) putHebrew(cx + CFG.hebCol - 1, r + i, t, tf, ln.bold); });
      cx += CFG.hebCol + CFG.gap;
      if (tf) wr.rom.forEach((t, i) => { if (r + i >= y0) scr.text(cx, r + i, t, tf, null, ln.bold); });
      cx += CFG.romCol + CFG.gap;
      if (r < y0) { r += wr.n; return; }                   // first line scrolled off: so have the one-line columns
      if (ln.contract || ln.holy || ln.unlisted) scr.text(cx + CFG.earnCol - 1, r, '—', ln.fg);   // an em dash where the money would be
      if (ln.contract) scr.text(cx + CFG.earnCol + CFG.gap, r, ln.contract, ln.fg, null, true);   // and its name where the amulet would be
      if (ln.earned != null) {
        // "$ .25" for small change so that "$5.25" stands out
        // "$ .25" for small change; whole dollars without cents so a penalty fits the column
        const e = ln.earned >= 0 && ln.earned < 100 ? `$ ${(ln.earned / 100).toFixed(2).slice(1)}`
                : ln.earned % 100 === 0 ? `${ln.earned < 0 ? '-' : ''}$${Math.abs(ln.earned) / 100}` : fmtMoney(ln.earned);
        scr.text(cx + CFG.earnCol - e.length, r, e, ln.amulet ? C.money : ln.fg, null, !!ln.amulet || ln.earned < 0);
      }
      cx += CFG.earnCol + CFG.gap;
      if (ln.amulet) {
        putHebrew(cx + CFG.amuHebCol - 1, r, ln.amulet.heb || '', C.money, true);  cx += CFG.amuHebCol + CFG.gap;
        scr.text(cx, r, (ln.amulet.gloss || ln.amulet.rom || '').slice(0, x0 + w - cx), C.money, null, true);
      }
    } else scr.text(x0, r, ln.text.slice(0, w), ln.fg, null, ln.bold);
    r += wr.n;
  });

  // a divider across the whole pane, joined to the panel border on both sides
  const dy = y0 + logRows;
  scr.put(x0 - 2, dy, '├', C.border);
  for (let c = x0 - 1; c <= x0 + w; c++) scr.put(c, dy, '─', C.border);
  scr.put(x0 + w + 1, dy, '┤', C.border);

  if (!state.word) return;
  const word = state.word;
  const py = dy + 1;

  // --- hebrew line (right to left) ---
  const hebSegs = word.filter(s => s.t === 'C');
  const n = hebSegs.length;
  // the number column shows a running gematria of what has been spoken so
  // far, in exactly the spot the final sum will occupy once the row moves up
  // into history.  (experimental: nothing is shown before the first letter.)
  // on a match the whole prompt row lights up, in step with the amulet's row
  const lit = state.matchHold ? C.money : null;
  if (lit) scr.fill(x0, py, w, 1, ' ', C.bg, lit);
  if (state.ci > 0 || state.holding || state.err) {
    const spokenHeb = state.cons.slice(0, state.ci).map(c => word[c.segIndex].heb).join('');
    // mistakes count too: stray letters are scored as the hebrew they would have been
    const strayHeb = state.err ? romToHeb(state.errTyped.join('')) : '';
    const v = String(gval(spokenHeb + strayHeb));
    scr.text(x0 + CFG.valCol - v.length, py, v, lit ? C.bg : state.err ? C.bad : C.fg, lit, !!lit);
  }
  const hx = x0 + CFG.valCol + CFG.gap + CFG.hebCol - 1;   // right edge of the hebrew column (after the gematria column)
  hebSegs.forEach((s, i) => {
    const col = hx - i;                               // reading order runs right→left
    const k = state.cons.findIndex(c => c.segIndex === word.indexOf(s));
    let fg = C.vowel, bold = false;
    if (s.silent) fg = C.vowel;
    else if (k < state.ci) fg = C.dim;
    else if (k === state.ci) { fg = word.free ? C.contract : C.primary; bold = true; }   // a bought word: blue
    else fg = C.secondary;
    scr.put(col, py, s.heb, lit ? C.bg : fg, lit, lit ? true : bold);     // same row as the romanization
  });

  // --- romanization line ---
  const rom = [];
  let ck = 0;
  for (const s of word) {
    if (s.t === '-') rom.push({ ch: '-', fg: C.vowel });
    else if (s.t === 'V') for (const ch of s.rom) rom.push({ ch: ch.toUpperCase(), fg: C.vowel });
    else if (s.silent) { /* alef: nothing in the romanization */ }
    else {
      const k = ck++;
      [...s.rom].forEach((ch, j) => {
        let fg = C.secondary, bold = false;
        if (k < state.ci || (k === state.ci && j < state.li)) fg = C.dim;
        else if (k === state.ci) { fg = word.free ? C.contract : C.primary; bold = true; }
        rom.push({ ch: ch.toUpperCase(), fg, bold });
      });
    }
  }
  const rx = hx + 1 + CFG.gap;
  rom.forEach((c, i) => scr.put(rx + i, py, c.ch, lit ? C.bg : c.fg, lit, lit ? true : c.bold));
  if (word.free) {
    // a bought word is named where its ledger line will name it: a dash where
    // the money would be (if the word leaves room) and its title after it
    const u = UPGRADES.find(x => x.id === word.grants);
    const label = (u ? u.title : 'contract').replace(/\s*©.*$/, '').toUpperCase();
    const dashX = rx + CFG.romCol + CFG.gap + CFG.earnCol - 1;
    if (rx + rom.length < dashX - 1) scr.put(dashX, py, '—', C.contract);
    scr.text(Math.max(dashX + 1 + CFG.gap, rx + rom.length + CFG.gap), py, label, C.contract, null, true);
  }

  // --- input box: ghost consonants in grey that you overwrite as you type ---
  const inp = [];
  ck = 0;
  let cursorAt = -1;
  for (const s of word) {
    if (s.t !== 'C') continue;                        // consonants only mark the way
    {
      const k = ck++;
      [...s.rom].forEach((ch, j) => {
        const done = k < state.ci || (k === state.ci && j < state.li);
        const isCursor = k === state.ci && j === state.li;
        if (isCursor) cursorAt = inp.length;
        inp.push({ ch: ch.toUpperCase(), fg: done ? C.bright : C.ghost, bold: done, slot: true });
      });
    }
  }
  // after a mistake, whatever was typed lands in the slots in red
  if (state.err) {
    let at = cursorAt;
    for (const k of state.errTyped) {
      while (at < inp.length && !inp[at].slot) at++;
      if (at >= CFG.inputMax) break;
      inp[at] = { ch: k.toUpperCase(), fg: C.bad, bold: true, slot: true };   // runs past the end if need be
      at++;
    }
    cursorAt = Math.min(at, inp.length);
  }
  const ix = rx, iy = py + 1;                          // first letter lines up with the prompt
  if (state.err) for (const c of inp) if (c.fg === C.ghost) c.ch = ' ';     // the way ahead vanishes
  // the hebrew of what you have spoken so far, growing leftward beside the box
  const spoken = state.cons.slice(0, state.ci).map(c => word[c.segIndex].heb).join('');
  putHebrew(hx, iy, spoken, C.bright, true);
  inp.forEach((c, i) => scr.put(ix + i, iy, c.ch, c.fg, null, c.bold));
  if (cursorAt >= 0 && cursorAt < inp.length && state.blinkOn && !state.holding && !state.modal) {
    const c = inp[cursorAt];
    scr.put(ix + cursorAt, iy, c.ch, C.bg, state.err ? C.bad : C.fg, c.bold);
  }
  // running total, in the money column, on the row above the status bar
  const money = fmtMoney(state.cents);
  const earnRight = x0 + CFG.valCol + CFG.gap + CFG.hebCol + CFG.gap + CFG.romCol + CFG.gap + CFG.earnCol;
  scr.text(earnRight - money.length, py + 2, money, C.money, null, true);

  // status bar: a background-coloured line with a red MIC indicator
  const sy = py + 3;
  scr.fill(x0, sy, w, 1, ' ', C.fg, C.statusBg);
  const mic = ' MIC: ON ';
  scr.text(x0, sy, mic, C.bright, C.bad, true);
  scr.text(x0 + mic.length + 2, sy, CFG.statusMsg, C.bright, C.statusBg);
  if (state.holding) {
    // a thinking pause: dots creep out after the box
    const dots = '.'.repeat(1 + (state.holdTicks % 3));
    scr.text(rx + CFG.boxCols, iy, dots, C.bright);
  }
}

// the bought names now in force, with the words of effect each has left
function drawActive(x0, y0, w, h) {

  // only names in force, and for a moment the one just spent

    for (const wd of 'No active names. You can buy names from the company store.'.split(' '))

    lines.slice(0, h).forEach((l, i) => scr.text(x0, y0 + i, l, C.fg));

  scr.text(x0, y0, 'NAME', C.fg, null, true);

  });
