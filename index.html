// only names you can afford can be selected; with none, nothing is
function buyable() { return UPGRADES.map((u, i) => i).filter(i => state.cents >= UPGRADES[i].cost); }
function choose(can, sel) {
  if (!can.length) return -1;
  if (can.includes(sel)) return sel;
  const below = can.filter(i => i < sel);                       // money ran short: the nearest above it
  return below.length ? below[below.length - 1] : can[0];
}
function selected() { return choose(buyable(), state.sel); }
// the office store works the same way, less whatever is already on the wall
const officeForSale = () => OFFICE_ITEMS.map((it, i) => i).filter(i => !OFFICE_ITEMS[i].owned());
function officeBuyable() { return officeForSale().filter(i => state.cents >= OFFICE_ITEMS[i].cost); }
function officeSelected() { return choose(officeBuyable(), state.officeSel); }
function drawUpgrade(x0, y0, w, h) {
  const C = CFG.colors;
  scr.text(x0 + 1, y0, 'Speech licenses valid for ONE USE ONLY per purchase.', C.fg);
  scr.text(x0 + 1, y0 + 1, 'Names are copyrighted speech. Improper use is punishable by law.', C.fg);
  const anyAffordable = UPGRADES.some(u => state.cents >= u.cost);
  if (!anyAffordable) {
    const msg = 'Insufficient funds.';
    scr.text(x0 + Math.floor((w - msg.length) / 2), y0 + 3, msg, C.bright);
  }
  UPGRADES.forEach((u, i) => {
    const r = y0 + 4 + i;
    const can = state.cents >= u.cost;
    const hi = i === selected();
    // too expensive: greyed out.  affordable: price in gold.  highlighted: reverse video.
    const bg = hi ? (can ? C.fg : C.dim) : null;
    const fg = hi ? C.bg : (can ? C.fg : C.dim);
    if (hi) scr.fill(x0, r, w, 1, ' ', fg, bg);
    const cost = `$${(u.cost / 100).toFixed(2)}`;
    scr.text(x0 + 1, r, u.title, hi ? C.bg : (can ? C.bright : C.dim), bg, can);
    // title | description | price | hebrew | romanization
    scr.text(x0 + 24, r, u.desc, fg, bg);
    scr.text(x0 + 47 - cost.length, r, cost, hi ? C.bg : (can ? C.money : C.dim), bg, can);
    putHebrew(x0 + 62, r, u.heb, fg, bg, can);
    scr.text(x0 + 65, r, u.rom.toUpperCase(), fg, bg);
  });
  scr.text(x0 + 1, y0 + h - 1, fmtMoney(state.cents), C.money, null, true);
}

function drawModal() {
  const C = CFG.colors, m = state.modal;
  const u = protectedById(m.id);
  const W = 62, inner = W - 4;
  const paras = [
    'You have been found in violation of federal intellectual property law (17 U.S.C. § 501).',
    null,                                                            // the citation line
    'A disciplinary penalty has been immediately assessed in the amount of:',
    { amount: fmtMoney(-u.penalty) },                                // centred, in red, with the minus
    'Collection shall not be deemed a waiver of the Company\'s right to pursue further fines, sanctions, ' +
    'or proceedings arising from this or any related infraction.',
    'A record of this infraction has been added to your permanent record.',
  ];
  // word-wrap each paragraph to the inner width, blank line between
  const lines = [];
  for (const p of paras) {
    if (p === null) { lines.push({ cite: true }); lines.push(''); continue; }
    if (p.amount) { lines.push(p); lines.push(''); continue; }
    let line = '';
    for (const word of p.split(' ')) {
      if ((line + ' ' + word).trim().length > inner) { lines.push(line); line = word; }
      else line = (line + ' ' + word).trim();
    }
    lines.push(line); lines.push('');
  }
  const H = lines.length + 8;
  const x = Math.floor((scr.cols - W) / 2), y = Math.floor((scr.rows - H) / 2);
  const title = ' UNLICENSED UTTERANCE DETECTED ';
  const on = state.blinkOn;                                  // in step with the cursor's blink
  if (on) scr.clear();                                       // the world blanks while the title is lit
  scr.fill(x, y, W, H, ' ', C.fg, C.bg);
  scr.box(x, y, W, H, null, C.bad);
  scr.text(x + Math.floor((W - title.length) / 2), y, title, on ? C.bright : C.bad, on ? C.bad : C.bg, true);
  let r = y + 2;
  for (const ln of lines) {
    if (ln && ln.cite) {
      const a = 'Citation: ', b = ` (${u.title})`;
      scr.text(x + 2, r, a, C.fg);
      putHebrew(x + 2 + a.length + u.heb.length - 1, r, u.heb, C.bright, true);
      scr.text(x + 2 + a.length + u.heb.length, r, b, C.fg);
    } else if (ln && ln.amount) {
      scr.text(x + Math.floor((W - ln.amount.length) / 2), r, ln.amount, C.bad, null, true);
    } else scr.text(x + 2, r, ln, C.fg);
    r++;
  }
  const btn = '[ I ACCEPT ]';
  scr.text(x + Math.floor((W - btn.length) / 2), y + H - 4, btn, C.bg, C.fg, true);
  scr.text(x + 2, y + H - 2, 'Press any key to continue.', C.fg);
}

// ---------- the game's menu ----------
// Not the Company's: ESC from anywhere inside brings it up over everything, and
// the clock stops while it is up.  A list like the stores', and ESC to go back.
const MENU_ITEMS = [
  { label: 'RESTART GAME', confirm: { text: ['Erase all progress and start over?', 'This can\'t be undone.'],
                                      options: ['KEEP PLAYING', 'ERASE AND RESTART'], danger: 1, act: restartGame } },
];
function restartGame() {
  state.erasing = true;                      // nothing more is saved on the way out
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  location.reload();
}
function menuKey(e) {
  const m = state.menu, c = m.confirm;
  if (c) {                                   // the question: ←→ choose, ENTER answers, ESC backs out of it
    const n = c.options.length;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Tab'].includes(e.key)) {
      const back = e.key === 'ArrowLeft' || e.key === 'ArrowUp';
      c.sel = (c.sel + (back ? n - 1 : 1)) % n;
    } else if (e.key === 'Enter' || e.key === ' ') {
      if (c.sel === 0) m.confirm = null;     // the first answer is always the safe one
      else c.act();
    } else if (e.key === 'Escape') m.confirm = null;
    return;
  }
  if (e.key === 'Escape') { state.menu = null; save(); }
  else if (e.key === 'ArrowDown') m.sel = Math.min(m.sel + 1, MENU_ITEMS.length - 1);
  else if (e.key === 'ArrowUp') m.sel = Math.max(m.sel - 1, 0);
  else if (e.key === 'Enter') { const it = MENU_ITEMS[m.sel]; if (it.confirm) m.confirm = { ...it.confirm, sel: 0 }; }
}
// a notice has the screen: the light layers are put away, and holy words settle back into the glass.
// the menu only covers its own box: the light goes on around it, cut away where the box is
const seized = () => modalVisible();
function menuBox() {
  const m = state.menu, c = m.confirm;
  const W = 50, x = Math.floor((scr.cols - W) / 2);
  const said = c ? c.text : state.clock ? ['The real-time clock is stopped.'] : [];
  const listRows = c ? 1 : MENU_ITEMS.length;
  const H = 4 + (said.length ? said.length + 1 : 0) + listRows + 1 + 2;   // border and a blank, GAME PAUSED and a blank, what it says, the list, a blank, the hint and border
  return { x, y: Math.floor((scr.rows - H) / 2), W, H, said };
}
// the light layers lie over the terminal, so the menu's box is cut out of each of them
let maskWas = '';
function maskLayers() {
  const box = state.menu && menuBox(), v = scr.view.getBoundingClientRect();
  const key = box ? [box.x, box.y, box.W, box.H, v.left, v.top, v.width, v.height].join() : '';
  if (key === maskWas) return;
  maskWas = key;
  for (const id of ['gravity', 'radiance', 'levitate']) {
    const el = document.getElementById(id);
    if (!box) { el.style.clipPath = ''; continue; }
    const e = id === 'gravity' ? v : { left: 0, top: 0 };   // gravity lies exactly over the terminal (and may be hidden); the others cover the window
    const sx = v.width / scr.cols, sy = v.height / scr.rows;
    const x1 = v.left + box.x * sx - e.left, y1 = v.top + box.y * sy - e.top;
    const x2 = x1 + box.W * sx, y2 = y1 + box.H * sy;
    // the whole layer, less the box: one outline traced around, a hole traced inside
    el.style.clipPath = `polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0, ${x1}px ${y1}px, ${x1}px ${y2}px, ${x2}px ${y2}px, ${x2}px ${y1}px, ${x1}px ${y1}px)`;
  }
}
function drawMenu() {
  const C = CFG.colors, m = state.menu, c = m.confirm;
  const { x, y, W, H, said } = menuBox();
  scr.fill(x, y, W, H, ' ', C.fg, C.bg);
  scr.box(x, y, W, H, 'MENU', C.bright);
  const head = 'GAME PAUSED';
  scr.text(x + Math.floor((W - head.length) / 2), y + 2, head, C.bright, null, true);
  let r = y + 4;
  said.forEach(ln => scr.text(x + Math.floor((W - ln.length) / 2), r++, ln, C.fg));
  if (said.length) r++;
  if (c) {                                   // buttons, as in the alley
    const btns = c.options.map(o => `[ ${o} ]`), gap = 4;
    let bx = x + Math.floor((W - btns.join(' '.repeat(gap)).length) / 2);
    btns.forEach((b, i) => {
      const on = i === c.sel, red = on && i === c.danger;    // the destructive one lights white on red, like MIC: ON
      scr.text(bx, r, b, on ? (red ? C.bright : C.bg) : C.fg, on ? (red ? C.bad : C.fg) : null, on);
      bx += b.length + gap;
    });
  } else MENU_ITEMS.forEach((it, i) => {     // rows, as in the stores: highlighted in reverse video
    const hi = i === m.sel, row = r + i;
    if (hi) scr.fill(x + 2, row, W - 4, 1, ' ', C.bg, C.fg);
    scr.text(x + 3, row, it.label, hi ? C.bg : C.bright, hi ? C.fg : null, true);
  });
  const hint = c ? '(Press ESC to go back.)' : '(Press ESC to resume.)';
  scr.text(x + Math.floor((W - hint.length) / 2), y + H - 2, hint, CFG.breakScene.escColor);
}

function drawOffice(x0, y0, w, h) {
  const C = CFG.colors, forSale = officeForSale();
  scr.text(x0 + 1, y0 + 1, state.clock ? 'Your office has a wall clock.' : 'Your office has no decorations.', C.fg);
  if (forSale.length && !officeBuyable().length) {
    const msg = 'Insufficient funds.';
    scr.text(x0 + Math.floor((w - msg.length) / 2), y0 + 3, msg, C.bright);
  }
  // as on BUY NAMES: too expensive, greyed out; affordable, price in gold; highlighted, reverse video
  forSale.forEach((i, k) => {
    const it = OFFICE_ITEMS[i], r = y0 + 4 + k;
    const can = state.cents >= it.cost, hi = i === officeSelected();
    const bg = hi ? (can ? C.fg : C.dim) : null;
    const fg = hi ? C.bg : (can ? C.fg : C.dim);
    if (hi) scr.fill(x0, r, w, 1, ' ', fg, bg);
    const cost = `$${(it.cost / 100).toFixed(2)}`;
    scr.text(x0 + 1, r, it.label, hi ? C.bg : (can ? C.bright : C.dim), bg, can);
    scr.text(x0 + 47 - cost.length, r, cost, hi ? C.bg : (can ? C.money : C.dim), bg, can);
  });
  scr.text(x0 + 1, y0 + h - 1, fmtMoney(state.cents), C.money, null, true);
}

function drawClockOut(x0, y0, w, h) {
  const C = CFG.colors;
  if (!breaksOpen()) {
    if (!state.clock) { scr.text(x0 + 1, y0 + 1, "It's not time to take a break yet.", C.fg); return; }
    const bell = 60 * CFG.clock.breakEvery, mins = Math.ceil((bell - state.clockT % bell) / 60);   // to the next break time
    scr.text(x0 + 1, y0 + 1, state.breakDue ? `I should do some words before I go. ${state.wordsLeft}`
                                            : `Just ${mins} minute${mins === 1 ? '' : 's'} left.`, C.fg);
    return;
  }
  const now = performance.now();
  Break.draw(scr, x0, y0, w, h, now, (now - state.litAt) / 1000);
  holyCells = Break.holyCells;
}

let drawPending = false;
let perfMsg = null;        // dev: shown on the title row when ?perf is used
function draw() {
  // many callers, one paint per frame
  if (drawPending) return;
  drawPending = true;
  requestAnimationFrame(() => { drawPending = false; drawNow(); });
}
let holyCells = [];        // cell rects of the holy rows on screen, for the radiance
function drawNow() {
  const C = CFG.colors;
  scr.clear();
  holyCells = [];
  const cols = scr.cols, rows = scr.rows;
  Clock.tick(performance.now());

  // smoking: the tab bar is gone
  const bare = state.tab === 'CLOCK OUT' && breaksOpen() && Break.bare(performance.now(), (performance.now() - state.litAt) / 1000);

  // title row
  scr.text(1, 0, 'countenance', C.fg);
  if (perfMsg) scr.text(20, 0, perfMsg, C.bad, null, true);

  // main panel, with a side panel on the right while speaking
  const side = state.tab === 'SPEAK' ? CFG.sideCols : 0;
  const px = 0, py = 1, pw = cols - side, ph = rows - 3;
  scr.box(px, py, pw, ph, state.tab);
  const ix = px + 2, iy = py + 1, iw = pw - 4, ih = ph - 2;
  if (state.tab === 'SPEAK') {
    drawSpeak(ix, iy, iw, ih);
    // the side panel: AMULETS above, ACTIVE NAMES below, sharing a border
    const ah = CFG.activeRows, top = ph - ah + 1;
    scr.box(pw, py, side, top, 'AMULETS');
    scr.box(pw, py + top - 1, side, ah, 'ACTIVE NAMES');
    scr.put(pw, py + top - 1, '├', C.border); scr.put(pw + side - 1, py + top - 1, '┤', C.border);
    drawSide(pw + 2, iy, side - 4, top - 2);
    drawActive(pw + 2, py + top, side - 4, ah - 2);
  } else if (state.tab === 'BUY NAMES') drawUpgrade(ix, iy, iw, ih);
  else if (state.tab === 'OFFICE') drawOffice(ix, iy, iw, ih);
  else drawClockOut(ix, iy, iw, ih);

  // tab bar.  a dialogue on the break leaves it drawn, but it has the keys, so no promise of ←→
  const ty = rows - 1;
  if (!bare) scr.fill(0, ty, cols, 1, ' ', C.tabFg, C.tabBg);
  let tx = 1;
  for (const t of bare ? [] : state.tabs) {
    if (t === 'CLOCK OUT') tx += 2;                  // set a little apart: leaving is not like the others
    const label = ` ${t} `;
    const active = t === state.tab || (state.nudge[t] > 0 && state.blinkOn);
    scr.text(tx, ty, label, active ? C.tabActFg : C.tabFg, active ? C.tabActBg : C.tabBg, active);
    tx += label.length + 1;
  }
  const out = state.tab === 'CLOCK OUT' && breaksOpen();
  const choosing = state.tab === 'BUY NAMES' && selected() >= 0 || state.tab === 'OFFICE' && officeSelected() >= 0
                || out && Break.phase() === 'menu';
  const hint = out && Break.captive() ? '' : (choosing ? '←→ tabs  ↑↓ select' : '←→ tabs') + '  Esc menu';   // nothing to select, no promise of it
  const clockCols = state.clock && !bare ? CFG.clock.cols : 0;   // the clock is on the wall: outside, with the tabs, it is gone
  scr.text(cols - clockCols - hint.length - 1, ty, hint, C.tabFg, C.tabBg);
  if (clockCols) Clock.place(scr, cols - clockCols, rows - CFG.clock.rows);

  if (modalVisible()) {
    if (!state.modal.applied) applyViolation(state.modal);
    drawModal();
  }
  if (state.menu) drawMenu();
  scr.render();
  Clock.paint(scr);
  const held = seized();
  maskLayers();
  Radiance.set(held ? [] : holyCells, scr);   // the notice (or the menu) seizes the screen; the light waits
  Gravity.set(held ? [] : holyCells, scr);    // and the cloth lies flat again
  Levitate.set(held ? [] : holyCells, scr);   // and the word settles back into the glass
}

// ---------- persistence ----------
const SAVE_KEY = 'countenance.v3';   // bump when the saved shape changes
function save() {
  if (state.erasing) return;                 // restarting: the old game is not written back
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      cents: state.cents, amulets: state.amulets.map(a => a.heb), log: state.log.slice(-200),
      stack: state.stack, charges: state.charges, infractions: state.infractions,
      clock: state.clock, clockT: Math.round(state.clockT), breakDue: state.breakDue, paused: !!state.menu, wordsLeft: state.wordsLeft,
      modal: state.modal ? { kind: state.modal.kind, id: state.modal.id, showAt: state.modal.showAt, applied: state.modal.applied } : null,
    }));
  } catch (e) { /* private window or storage disabled: play on without memory */ }
}
function load() {
  try {
    if (new URLSearchParams(location.search).has('reset')) {
      localStorage.removeItem(SAVE_KEY);
      history.replaceState(null, '', location.pathname);   // drop ?reset so a reload keeps the fresh game
      return false;
    }
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return false;
    state.cents = d.cents || 0;
    state.amulets = (d.amulets || []).map(h => AMULET_POOL.find(a => a.heb === h)).filter(Boolean);
    state.log = d.log || [];
    state.charges = d.charges || {};
    const kept = d.stack || d.queue;           // (saves from before the stack kept a queue, newest last as well)
    if (Array.isArray(kept)) state.stack = kept.filter(id => UPGRADES.some(u => u.id === id));
    else for (const id of d.owned || []) {     // an older save: one licence per purchase still owed
      const u = UPGRADES.find(x => x.id === id);
      const n = u && u.charges ? Math.max(1, Math.round(((d.pending || {})[id] || 0) / u.charges)) : u ? 1 : 0;
      for (let k = 0; k < n; k++) state.stack.push(id);
    }
    state.infractions = d.infractions || 0;
    state.clock = !!d.clock;
    state.clockT = d.clockT || CFG.clock.dayStart;
    state.breakDue = !!d.breakDue;
    if (d.paused) state.menu = { sel: 0, confirm: null };   // left paused: still paused
    state.wordsLeft = d.wordsLeft ?? CFG.clock.wordsPerBreak;
    state.modal = d.modal || null;
    return true;
  } catch (e) { return false; }
}

// ---------- boot ----------
const scr = new Screen();
window.addEventListener('resize', () => { scr.resize(); draw(); });   // (the radiance resizes itself)
window.addEventListener('keydown', e => { handleKey(e); draw(); });

window.addEventListener('error', e => {
  // last resort: show the fault on screen rather than a black page
  scr.clear();
  scr.text(1, 1, 'countenance fault: ' + e.message, CFG.colors.bad, null, true);
  scr.text(1, 3, 'add ?reset to the address to clear the saved game', CFG.colors.fg);
  scr.render();
});

state.intro = INTRO.map(l => '  ' + l);
load();
// :00 or :30: a break comes due, after the words.  one already due stays as it is, words said and all,
// however many bells go by: only lighting up spends it
Clock.onBell = () => { if (!state.breakDue) { state.breakDue = true; state.wordsLeft = CFG.clock.wordsPerBreak; nudge('CLOCK OUT'); save(); } };
addEventListener('pagehide', save);                  // the clock's last minutes, kept
replenishAmulets();
{ // dev: ?demo=N pre-fills N spoken words so the scrolling can be inspected
  const n = parseInt(new URLSearchParams(location.search).get('demo') || '0', 10);
  for (let i = 0; i < n; i++) {
    const wd = makeWord(), a = i === n - 2 ? pick(AMULET_POOL) : null;   // one fake match, for layout
    logLine(`  ${romanization(wd)}`, CFG.colors.fg, false, hebrew(wd), gematria(wd),
            CFG.cents + (a ? CFG.bonusCents : 0), a ? { heb: a.heb, gloss: a.gloss } : null);
  }
}
newWord();

setInterval(() => {
  state.blinkOn = state.menu ? true : !state.blinkOn;   // 1 Hz: the cursor, the notice's flash, the tabs' nudges (held still while paused)
  if (!state.menu) for (const t in state.nudge) if (state.nudge[t] > 0) state.nudge[t]--;
  draw();
}, 500);
setInterval(() => {
  if (state.holding) { state.holdTicks++; draw(); }
}, 250);
setInterval(() => {
  if (state.tab === 'CLOCK OUT' && breaksOpen() && ['smoking', 'out'].includes(Break.phase())) draw();
}, 50);


document.fonts.ready.then(() => { scr.resize(); draw(); });
draw();
if (new URLSearchParams(location.search).has('perf')) {
  // dev: time 200 full redraws and show the average in the title bar
  const t0 = performance.now();
  for (let i = 0; i < 200; i++) drawNow();
  perfMsg = `draw ${((performance.now() - t0) / 200).toFixed(2)} ms`;
  document.title = perfMsg;
  draw();
}
</script>
</body>
</html>
